<article class="card-produto" [attr.aria-labelledby]="titleId">
    <div class="card-produto__conteudo">

        <!-- Imagem -->
        <figure class="card-produto__imagem">
            <img [src]="product().image" [alt]="product().title" width="300" height="300" decoding="async">
        </figure>

        <!-- Texto -->
        <div class="container__texto">

            <!-- Título -->
            <h2 [id]="titleId">
                {{ product().title }}
                <span class="destaque">{{ product().title_highlight }}</span>
                <span class="tipo">{{ product().type }}</span>
            </h2>

            <!-- Peso / Especificação -->
            <h3 class="destaque--bege">{{ product().specification }}</h3>

            <!-- Descrição -->
            <p>
                {{ product().description }}
                <span>{{ product().description_highlight }}</span>
            </p>
        </div>
    </div>

    <!-- Botão comprar -->
    <a class="botao__comprar"
       [href]="link()"
       [attr.aria-label]="ariaLabel()"
       target="_blank"
       rel="noopener noreferrer">
        <img src="/icones/zap-card-produto.svg" alt="" width="25" height="25">
        <span>{{ product().botao || 'COMPRAR AGORA' }}</span>
        <img src="/icones/seta-card-produto.svg" alt="" width="28" height="16">
    </a>
</article>
