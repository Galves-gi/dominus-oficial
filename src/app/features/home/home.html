<main>
    <app-banner />

    <h1 id="catalogo">
        {{ content.h1.prefix }}
        <span class="destaque--bege">{{ content.h1.highlight }}</span>
    </h1>

    <section class="container__cards-produtos" aria-labelledby="catalogo">
        @for (produto of dataProduct; track produto.id;let i = $index) {
        <app-card-product-home [product]="produto" appAnimateCardOnScroll [delay]="i" direction="right" [once]="true" />
        }

        <app-card-product-home class="cafelab" [product]="cafelab" appAnimateCardOnScroll [delay]="13" direction="right"
            [once]="true" />
    </section>
</main>
