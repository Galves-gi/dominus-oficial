<main>

    <app-banner></app-banner>

    <h1 id="catalogo">Conheça Nosso Catálogo de <br><span class="destaque--bege">Cafés Especiais:</span></h1>

    <article class="container__cards-produtos">
        @for (produto of dataProduct; track produto.id; let i = $index) {

        <app-card-product-home [product]="produto" appAnimateCardOnScroll [delay]="i"
            direction="right" [once]="true"></app-card-product-home>

        }
    </article>

</main>
